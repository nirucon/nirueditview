[package]
name = "nirueditview"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
description = "Fast picture and PDF viewer for NIRUX with simple editing: crop, rotate, draw, blur, and signatures and text on PDFs"
repository = "https://github.com/nirucon/nirueditview"

[dependencies]
x11rb = "0.13"
ab_glyph = "0.2"
toml = "0.8"
libc = "0.2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "tiff"] }
lopdf = { version = "0.47", default-features = false }
flate2 = "1"
kamadak-exif = "0.6"
md5 = "0.8"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
opt-level = 3
